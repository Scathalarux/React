<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel: compilador de JSX a JS-->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages, setChatMessages}) {
        const [inputText, setInputText] = React.useState("");

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          if(inputText != ''){
            setChatMessages([
              ...chatMessages,
              { id: crypto.randomUUID, message: inputText, sender: "user" },
            ]);
          };
        }

        return (
          <>
            <input
              type="text"
              placeholder="Enviar un mensaje al Chatbot"
              size="30"
              onChange={saveInputText}
            />
            <button onClick={sendMessage}>Enviar</button>
          </>
        );
      }

      function ChatMessage(/*props*/ { message, sender }) {
        /*const message = props.message;
        const sender = props.sender;*/

        //const { message , sender} = props;
        return (
          <div>
            {sender === "robot" && <img src="robot.png" alt="" width="50" />}
            {message}
            {sender === "user" && <img src="user.png" alt="" width="50" />}
          </div>
        );
      }

      function ChatMessages({chatMessages}) {
        return (
          <>
            {chatMessages.map((chatMessage, index) => {
              return (
                <ChatMessage
                  key={chatMessage.id}
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                />
              );
            })}
          </>
        );
      }

      function App() {
        // Array destructing
        const [chatMessages, setChatMessages] = React.useState([
          { id: "chatMessage-1", message: "Hola Chatbot", sender: "user" },
          {
            id: "chatMessage-2",
            message: "¡Hola! ¿En qué puedo ayudarte?",
            sender: "robot",
          },
          {
            id: "chatMessage-3",
            message: "Puedes decirme cuál es la fecha de hoy",
            sender: "user",
          },
          {
            id: "chatMessage-4",
            message: "Hoy es 13 de noviembre",
            sender: "robot",
          },
          {
            id: "chatMessage-5",
            message: "Qué tal si jugamos a cara o cruz?",
            sender: "user",
          },
          {
            id: "chatMessage-6",
            message: "Claro! Salió cara",
            sender: "robot",
          },
          {
            id: "chatMessage-7",
            message: "Vale, muchas gracias",
            sender: "user",
          },
          {
            id: "chatMessage-8",
            message: "De nada y cualquier otra duda me la preguntas",
            sender: "robot",
          },
        ]);
        //const [chatMessages, setChatMessages] = array; // alternativa a las líneas anteriores

        return (
          <>
            <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
            <ChatMessages 
              chatMessages={chatMessages}
            />
          </>
        );
      }
      // {ChatInput()} == <ChatInput></ChatInput>

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
