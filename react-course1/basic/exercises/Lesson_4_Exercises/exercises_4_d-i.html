<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      button {
        background-color: rgb(0, 123, 255);
        color: white;
        padding: 15px 20px;
        border-radius: 10px;
        border: none;
        margin: 5px 5px;
      }
      input {
        padding: 15px 20px;
        border-radius: 10px;
        border-width: 1px;
        margin: 0 5px;
      }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function App() {
        React.useEffect(() => {
            setInterval(()=>{
                setTime(dayjs().format("HH:mm:ss")); 
                console.log('run code');
            },1000)

        },[]);
        const [typeInput, setTypeInput] = React.useState("password");
        const [time, setTime] = React.useState(dayjs().format("HH:mm:ss"));

        function showPassword() {
          typeInput === "password"
            ? setTypeInput("text")
            : setTypeInput("password");
        }

        return (
          <>
            <h1>Hola, bienvenides a mi web</h1>
            <input type="email" placeholder="Email" />
            <input type={typeInput} placeholder="Password" />
            <button onClick={showPassword}>Show</button>

            <br />
            <button>Login</button>
            <button>Sing up</button>

            <br />
            <p>Current time: {time}</p>
          </>
        );
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
