<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        cursor: pointer;
      }
      .send-button,
      .chat-input {
        border-radius: 10px;
        font-size: 15px;
      }
      .chat-input {
        padding: 12px 15px;
        border-width: 1px;

        flex-grow: 1;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .app-container {
        max-width: 600px;
        margin: 0 auto;
        height: 100vh;

        display: flex;
        flex-direction: column;
      }
      .chat-message-user,
      .chat-message-robot {
        display: flex;
        margin: 20px 0;
        align-items: start;
      }

      .chat-message-user {
        justify-content: end;
      }
      .chat-message-robot {
        justify-content: start;
      }

      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin: 0 10px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }

      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
        p {
          color: gray;
        }
      }

      .chat-message-loading {
        height: 40px;
        margin: -15px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Librería externa para las respuestas de chatbot -->
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <!-- Babel: compilador de JSX a JS-->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (isLoading || inputText === "") {
            return;
          }
          setIsLoading(true);
          const newChatMessages = [
            ...chatMessages,
            {
              id: crypto.randomUUID,
              message: inputText,
              sender: "user",
            },
            {
              id: crypto.randomUUID,
              message: (
                <img
                  src="loading-spinner.gif"
                  className="chat-message-loading"
                />
              ),
              sender: "robot",
            },
          ];

          setChatMessages(newChatMessages);
          setInputText("");

          const response = await Chatbot.getResponseAsync(inputText);
          setChatMessages([
            //Borrar mensaje loading
            ...newChatMessages.slice(0, newChatMessages.length - 1),
            {
              id: crypto.randomUUID,
              message: response,
              sender: "robot",
            },
          ]);

          setIsLoading(false);
        }

        function keyDownHandler() {
          if (event.key === "Enter") {
            sendMessage();
          } else if (event.key === "Escape") {
            setInputText("");
          }
        }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Enviar un mensaje al Chatbot"
              size="30"
              onChange={saveInputText}
              onKeyDown={keyDownHandler}
              //Controlled Input
              value={inputText}
              disabled={isLoading}
              className="chat-input"
            />
            <button onClick={sendMessage} className="send-button">
              Enviar
            </button>
          </div>
        );
      }

      function ChatMessage(/*props*/ { message, sender }) {
        /*const message = props.message;
        const sender = props.sender;*/
        //const { message , sender} = props;

        return (
          <div
            className={
              sender === "user" ? "chat-message-user" : "chat-message-robot"
            }
          >
            {sender === "robot" && (
              <img src="robot.png" alt="" className="chat-message-profile" />
            )}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && (
              <img src="user.png" alt="" className="chat-message-profile" />
            )}
          </div>
        );
      }

      function useAutoScroll(dependencies) {
        const containerRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = containerRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [dependencies]);

        return containerRef;
      }

      function ChatMessages({ chatMessages }) {
        const chatMessagesRef = useAutoScroll([chatMessages])

        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.length === 0 && (
              <p>
                ¡Bienvenide al proyecto de chatbot! Envía un mensaje utilizando
                la caja de texto
              </p>
            )}
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  key={chatMessage.id}
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                />
              );
            })}
          </div>
        );
      }

      function App() {
        // Lifting the State Up
        // Array destructing
        /*const [chatMessages, setChatMessages] = React.useState([
          { id: "chatMessage-1", message: "Hola Chatbot", sender: "user" },
          {
            id: "chatMessage-2",
            message: "¡Hola! ¿En qué puedo ayudarte?",
            sender: "robot",
          },
          {
            id: "chatMessage-3",
            message: "Puedes decirme cuál es la fecha de hoy",
            sender: "user",
          },
          {
            id: "chatMessage-4",
            message: "Hoy es 13 de noviembre",
            sender: "robot",
          },
          {
            id: "chatMessage-5",
            message: "Qué tal si jugamos a cara o cruz?",
            sender: "user",
          },
          {
            id: "chatMessage-6",
            message: "Claro! Salió cara",
            sender: "robot",
          },
          {
            id: "chatMessage-7",
            message: "Vale, muchas gracias",
            sender: "user",
          },
          {
            id: "chatMessage-8",
            message: "De nada y cualquier otra duda me la preguntas",
            sender: "robot",
          },
        ]);*/
        const [chatMessages, setChatMessages] = React.useState([]);
        //const [chatMessages, setChatMessages] = array; // alternativa a las líneas anteriores

        return (
          <div className="app-container">
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }
      // {ChatInput()} == <ChatInput></ChatInput>

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
